<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>sky7 — إنشاء حساب</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page compact-auth"><button class="theme-toggle" data-theme-toggle>☼</button><main class="auth-shell"><section class="auth-visual"><div class="visual-orb orb-one"></div><div class="visual-orb orb-two"></div><div class="brand-lockup"><img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7"><span>sky7</span></div><div class="visual-copy"><p class="eyebrow">مساحتك البصرية</p><h1>كل سماء<br><em>لها قصة.</em></h1><p>أنشئ ملفك وابدأ في مشاركة العالم كما تراه.</p></div></section><section class="auth-panel"><div class="auth-card"><div class="mobile-brand brand-lockup"><img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7"><span>sky7</span></div><div class="section-heading"><p class="eyebrow">انضم إلى المجتمع</p><h2>أنشئ حسابك</h2><p>خطوتك الأولى نحو سماء أوسع.</p></div><form id="registerForm"><div class="input-grid"><label>الاسم الكامل<input id="registerName" required placeholder="مثال: ليان أحمد"></label><label>اسم المستخدم<input id="registerUsername" required placeholder="layan.sky"></label></div><label>البريد الإلكتروني<input id="registerEmail" type="email" required placeholder="you@example.com"></label><div class="input-grid"><label>كلمة المرور<input id="registerPassword" type="password" required minlength="6" placeholder="6 أحرف على الأقل"></label><label>تأكيد كلمة المرور<input id="registerConfirm" type="password" required placeholder="أعد كتابة كلمة المرور"></label></div><label>نبذة قصيرة<textarea id="registerBio" rows="2" placeholder="ما الذي تصوره عادة؟"></textarea></label><button class="primary-btn" type="submit"><span>إنشاء الحساب</span><span class="btn-spinner"></span></button><p id="registerError" class="form-error"></p></form><p class="switch-auth">لديك حساب بالفعل؟ <a href="index.html">تسجيل الدخول</a></p></div></section></main><div id="toastRoot"></div><script type="module" src="js/auth.js"></script><script type="module" src="js/ui.js"></script></body></html>
